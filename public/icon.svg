<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b7cff"/>
      <stop offset="0.55" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#5a36d6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0.35" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e5f8"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#glow)"/>

  <!-- sparkles, echoing the app's star effects -->
  <g fill="#ffffff" opacity="0.5">
    <path d="M196 232c7 42 11 46 53 53-42 7-46 11-53 53-7-42-11-46-53-53 42-7 46-11 53-53z"/>
    <path d="M846 388c5 30 8 33 38 38-30 5-33 8-38 38-5-30-8-33-38-38 30-5 33-8 38-38z"/>
    <path d="M818 742c4 22 6 24 28 28-22 4-24 6-28 28-4-22-6-24-28-28 22-4 24-6 28-28z"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="512" cy="792" rx="196" ry="30" fill="#2a1a6b" opacity="0.28" filter="url(#soft)"/>

  <!-- ghost body: dome top, three rounded bumps along the bottom -->
  <path fill="url(#body)" d="M283 630
    C283 415 385 235 512 235
    C639 235 741 415 741 630
    C741 745 589 745 589 630
    C589 745 436 745 436 630
    C436 745 283 745 283 630 Z"/>

  <!-- blush -->
  <g fill="#ff8fb3" opacity="0.5">
    <ellipse cx="362" cy="512" rx="44" ry="27"/>
    <ellipse cx="662" cy="512" rx="44" ry="27"/>
  </g>

  <!-- eyes -->
  <g fill="#2b2340">
    <ellipse cx="426" cy="440" rx="58" ry="69"/>
    <ellipse cx="598" cy="440" rx="58" ry="69"/>
  </g>
  <g fill="#ffffff">
    <circle cx="447" cy="414" r="19"/>
    <circle cx="619" cy="414" r="19"/>
    <circle cx="411" cy="464" r="9"/>
    <circle cx="583" cy="464" r="9"/>
  </g>

  <!-- smile -->
  <path d="M478 541 Q512 592 546 541 Z" fill="#e8537a"/>
</svg>
