name: Windows build

# Manual only: Actions tab -> "Windows build" -> Run workflow. Produces an installer you can download and send.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Bake in the Google sign-in client (only if the secrets exist)
        shell: pwsh
        env:
          GID: ${{ secrets.LIFEPET_GOOGLE_CLIENT_ID }}
          GSECRET: ${{ secrets.LIFEPET_GOOGLE_CLIENT_SECRET }}
        run: |
          if ($env:GID -and $env:GSECRET) {
            "LIFEPET_GOOGLE_CLIENT_ID=$env:GID" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            "LIFEPET_GOOGLE_CLIENT_SECRET=$env:GSECRET" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          } else {
            Write-Host "No Google client secrets set: Sign in with Google will say it isn't set up in this build."
          }
      - run: npm ci
      - run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Curet-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
