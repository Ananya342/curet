name: Windows build

# Manual only: Actions tab -> "Windows build" -> Run workflow. Produces an installer you can download and send.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Bake in the Google sign-in client (only if the secrets exist)
        shell: pwsh
        env:
          GID: ${{ secrets.LIFEPET_GOOGLE_CLIENT_ID }}
          GSECRET: ${{ secrets.LIFEPET_GOOGLE_CLIENT_SECRET }}
        run: |
          if ($env:GID -and $env:GSECRET) {
            "LIFEPET_GOOGLE_CLIENT_ID=$env:GID" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            "LIFEPET_GOOGLE_CLIENT_SECRET=$env:GSECRET" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          } else {
            Write-Host "No Google client secrets set: Sign in with Google will say it isn't set up in this build."
          }
      - name: Bake in the shared Gemini and ElevenLabs keys (only the ones whose secrets exist)
        shell: pwsh
        env:
          GEMINI: ${{ secrets.LIFEPET_GEMINI_KEY }}
          ELEVEN: ${{ secrets.LIFEPET_ELEVEN_KEY }}
        run: |
          if ($env:GEMINI -or $env:ELEVEN) {
            "LIFEPET_SHARE_MY_KEYS=1" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          }
          if ($env:GEMINI) {
            "LIFEPET_GEMINI_KEY=$env:GEMINI" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          } else {
            Write-Host "No Gemini secret set: users paste their own key in Settings."
          }
          if ($env:ELEVEN) {
            "LIFEPET_ELEVEN_KEY=$env:ELEVEN" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          } else {
            Write-Host "No ElevenLabs secret set: users paste their own key for voice."
          }
      - run: npm ci
      - run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Curet-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
